---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: loki-stack
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    clients:
      - url: http://loki-write.monitoring.svc.cluster.local:3100/loki/api/v1/push
        batchsize: 1048576
        batchwait: 1s
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
        external_labels:
          cluster: production

    positions:
      filename: /run/promtail/positions.yaml

    target_config:
      sync_period: 10s

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - docker: {}
          - cri: {}
          - drop:
              expression: .*loki.*
              drop_counter_reason: loki_self_logs
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_controller_name]
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            target_label: __tmp_controller_name
            action: replace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app, __meta_kubernetes_pod_label_name, __meta_kubernetes_pod_name, __tmp_controller_name]
            regex: ^;*([^;]+)(;.*)?$
            target_label: app
            action: replace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*/*.log
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            target_label: job
            replacement: kubernetes-pods

      - job_name: system-journal
        journal:
          max_age: 12h
          labels:
            job: systemd-journal
        relabel_configs:
          - source_labels: [__journal__systemd_unit]
            target_label: unit
          - source_labels: [__journal__hostname]
            target_label: hostname
          - source_labels: [__journal_syslog_identifier]
            target_label: syslog_identifier
          - source_labels: [__journal_priority_keyword]
            target_label: level

    limits_config:
      readline_rate: 10000
      readline_burst: 100000
      readline_rate_drop: false