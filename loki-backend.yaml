---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-backend
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: loki-stack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: loki-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: loki-stack
    spec:
      serviceAccountName: loki
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                    app.kubernetes.io/part-of: loki-stack
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
            - -runtime-config.file=/etc/loki-runtime/runtime-config.yaml
            - -target=backend
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
            - name: memberlist
              containerPort: 7946
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: runtime-config
              mountPath: /etc/loki-runtime
              readOnly: true
            - name: tmp
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
            defaultMode: 0400
        - name: runtime-config
          configMap:
            name: loki-runtime-config
            defaultMode: 0400
        - name: tmp
          emptyDir: {}