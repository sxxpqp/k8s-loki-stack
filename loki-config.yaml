---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: loki-stack
data:
  loki.yaml: |
    auth_enabled: false

    common:
      compactor_address: http://loki-backend-headless.monitoring.svc.cluster.local:3100

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      http_server_read_timeout: 600s
      http_server_write_timeout: 600s
      grpc_server_max_recv_msg_size: 104857600
      grpc_server_max_send_msg_size: 104857600

    # ── 成员发现 ──────────────────────────────────────────────
    memberlist:
      join_members:
        - loki-memberlist

    # ── Ingester 配置 ─────────────────────────────────────────
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 2
        num_tokens: 512
      chunk_idle_period: 30m
      chunk_retain_period: 2m
      max_chunk_age: 2h
      chunk_target_size: 1536000
      chunk_encoding: snappy
      wal:
        enabled: true
        dir: /var/loki/wal
        replay_memory_ceiling: 4GB

    # ── Distributor 配置 ──────────────────────────────────────
    distributor:
      ring:
        kvstore:
          store: memberlist

    # ── Schema 配置 ────────────────────────────────────────────
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # ── 存储后端 (本地文件系统) ──────────────────────────────
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
        cache_ttl: 168h
      aws:
        s3: http://minio.minio.svc.cluster.local:9000
        bucketnames: loki-data
        region: us-east-1
        access_key_id: minioadmin
        secret_access_key: minioadmin
        s3forcepathstyle: true
        insecure: true

    # ── Compactor ─────────────────────────────────────────────
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3

    # ── 查询前端 ──────────────────────────────────────────────
    frontend:
      max_outstanding_per_tenant: 4096
      compress_responses: true
      log_queries_longer_than: 10s
      tail_proxy_url: http://loki-read:3100

    frontend_worker:
      frontend_address: loki-query-frontend-headless.monitoring.svc.cluster.local:9095
      grpc_client_config:
        max_recv_msg_size: 104857600
        max_send_msg_size: 104857600

    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 500

    # ── Ruler (告警规则评估) ───────────────────────────────────
    # 评估结果发送到 Alertmanager，Alertmanager 再通过 AlertmanagerConfig
    # 路由到 PrometheusAlert → 企业微信
    ruler:
      alertmanager_url: http://alertmanager-operated.monitoring.svc.cluster.local:9093
      enable_alertmanager_v2: true
      external_url: http://loki-read.monitoring.svc.cluster.local:3100
      storage:
        type: local
        local:
          directory: /var/loki/rules
      rule_path: /var/loki/rules-temp
      ring:
        kvstore:
          store: memberlist
      enable_api: true
      enable_sharding: true
      poll_interval: 1m
      wal:
        dir: /var/loki/ruler-wal
        truncate_frequency: 60m

    # ── 限流配置 ──────────────────────────────────────────────
    limits_config:
      retention_period: 744h
      max_entries_limit_per_query: 50000
      max_global_streams_per_user: 0
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      split_queries_by_interval: 15m
      max_query_series: 10000
      max_query_parallelism: 32
      max_streams_per_user: 0
      max_query_length: 721h
      max_label_names_per_series: 25

    # ── Tracing 集成 (后续对接 k8s-tempo-stack) ────────────────
    tracing:
      enabled: false

    analytics:
      reporting_enabled: false