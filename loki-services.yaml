    app.kubernetes.io/part-of: loki-stack
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: read
    app.kubernetes.io/part-of: loki-stack
