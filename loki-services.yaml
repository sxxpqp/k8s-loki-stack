---
# ── memberlist 集群内部发现 ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: loki-memberlist
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: memberlist
    app.kubernetes.io/part-of: loki-stack
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: loki-stack
---
# ── Read 路径 (Querier + QueryFrontend) ────────────────────
apiVersion: v1
kind: Service
